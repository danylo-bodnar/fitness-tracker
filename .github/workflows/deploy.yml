name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore FitnessTracker.slnx

      - name: Build
        run: dotnet build FitnessTracker.slnx --configuration Release --no-restore

      - name: Run migrations
        run: |
          dotnet ef database update \
            --project ./FitnessTracker.Infrastructure \
            --startup-project ./FitnessTracker.Api \
            --no-build
        env:
          DATABASE_CONNECTION: ${{ secrets.DATABASE_CONNECTION }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: |
            danylobodnar/fitness-tracker:${{ github.sha }}
            danylobodnar/fitness-tracker:latest
          platforms: linux/amd64
